<html>
	<head>
		<style>
			.icon {
				vertical-align: middle;
				fill: currentColor;
				stroke: blue;
			}
			.ZoomButton {
				width: 36px;
				height: 48px;
				padding: 0px;
				margin: 0px;
				border: none;
				cursor: pointer;
				background-color: white;
			}
			.ZoomBar {
				display: flex;
				align-items: center;
				justify-content: center;
				position: absolute;
				z-index: 90;
				bottom: 8px;
				right: 8px;
				background-color: white;
				border-radius: 4px;
				box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.12);
				padding-top: 0px;
				padding-left: 8px;
				padding-bottom: 0px;
				padding-right: 16px;
			}
		</style>
	</head>
	<body>
		<div class="ZoomBar">
			<button title="Zoom In" class="ZoomButton">
				<svg
					class="icon"
					aria-hidden="true"
					focusable="false"
					width="24"
					height="24"
				>
					<image
						class="icon"
						width="24"
						height="24"
						xlink:href="toFit.svg"
					></image>
				</svg>
			</button>
			<button title="Zoom In" class="ZoomButton">
				<svg
					class="icon"
					aria-hidden="true"
					focusable="false"
					width="24"
					height="24"
				>
					<image
						class="icon"
						width="24"
						height="24"
						xlink:href="out.svg"
					></image>
				</svg>
			</button>
			<button title="Zoom In" class="ZoomButton">
				<svg
					class="icon"
					aria-hidden="true"
					focusable="false"
					width="24"
					height="24"
				>
					<image
						class="icon"
						width="24"
						height="24"
						xlink:href="in.svg"
					></image>
				</svg>
			</button>
			<button title="Zoom In" class="ZoomButton">
				<span>100%</span>
			</button>
		</div>
	</body>
</html>
