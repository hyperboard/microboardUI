<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="
			width=device-width,
			initial-scale=1,
			shrink-to-fit=no
			minimum-scale=1.0, 
			maximum-scale=1.0, 
			user-scalable=no
		 "
    />
    <title>Microboard</title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="public/favicons/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="public/favicons/favicon-32x32.png"
    />
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
    <link rel="icon" href="public/favicons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="public/favicons/apple-touch-icon.png"
    />
    <link rel="manifest" href="public/favicons/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" crossorigin href="public/index.css" />
    <script>
      (function () {
        var s = localStorage.getItem("ui-theme");
        var t =
          s === "light" || s === "dark"
            ? s
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>

  <body
    style="
      margin: 0;
      height: 100%;
      width: 100%;
      /* overflow: hidden; */
      position: fixed;
      padding: 0;
      touch-action: none;
      -ms-touch-action: none;
    "
  >
    <div
      id="root"
      style="
        height: 100%;
        width: 100%;
        resize: none;
        background: none;
        outline: none;
        border: none;
        padding: 0px;
        margin: 0px;
        overflow: auto;
      "
    >
      <div
        style="
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          width: 100vw;
        "
      >
        <div style="transform: scale(7)">
          <img src="public/loader.svg" alt="" />
        </div>
      </div>
    </div>
    <div id="modal"></div>
    <div id="selector"></div>
    <div
      id="drag"
      style="
        position: fixed;
        left: 0;
        top: 0;
        touch-action: none;
        height: 100%;
        width: 100%;
        z-index: 1000;
        pointer-events: none;
      "
    ></div>
    <div id="tooltip"></div>
    <script type="module" src="public/spa.ts"></script>
  </body>
</html>
