<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="
			width=device-width,
			initial-scale=1,
			shrink-to-fit=no
			minimum-scale=1.0, 
			maximum-scale=1.0, 
			user-scalable=no
		 "
		/>
		<title>Microboard</title>
		<link rel="icon" type="image/svg" href="/favicon.svg">
	</head>
	<body
		style="
			margin: 0;
			height: 100%;
			width: 100%;
			overflow: hidden;
			position: fixed;
			padding: 0;
			touch-action: none;
			-ms-touch-action: none;
		"
	>
		<div
			id="root"
			style="
				height: 100%;
				width: 100%;
				resize: none;
				background: none;
				outline: none;
				border: none;
				padding: 0px;
				margin: 0px;
				overflow: hidden;
			"
		>
			<div
				style="
					display: flex;
  					justify-content: center;
  					align-items: center;
				"
			>
				<label for="loading"><h1>Loading...</h1></label>
			</div>
		</div>
		<input type="file" accept="image/*" id="image-upload" style="display: none;">
		<script src="/bundle.js"></script>
	</body>
</html>
