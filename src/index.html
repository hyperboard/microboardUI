<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="
			width=device-width,
			initial-scale=1,
			shrink-to-fit=no
			minimum-scale=1.0, 
			maximum-scale=1.0, 
			user-scalable=no
		 " />
	<title>Microboard</title>
	<link rel="icon" type="image/png" href="/favicon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
	<link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
	<link rel="stylesheet" type="text/css" href="/bundle.css">
</head>

<body style="
			margin: 0;
			height: 100%;
			width: 100%;
			/* overflow: hidden; */
			position: fixed;
			padding: 0;
			touch-action: none;
			-ms-touch-action: none;
			background-color: #fff;
		">
	<div id="root" style="
				height: 100%;
				width: 100%;
				resize: none;
				background: none;
				outline: none;
				border: none;
				padding: 0px;
				margin: 0px;
				overflow: auto;
			">
		<div style="
					display: flex;
  					justify-content: center;
  					align-items: center;
				">
			<label for="loading">
				<h1>Loading...</h1>
			</label>
		</div>
	</div>
	<div id="modal"></div>
	<div id="selector"></div>
	<div id="drag" style="position: fixed; left: 0; top: 0; touch-action: none; height: 100%; width: 100%; z-index: 1000; pointer-events: none;">
	</div>
	<script type="module" src="/bundle.js"></script>
</body>
</html>
