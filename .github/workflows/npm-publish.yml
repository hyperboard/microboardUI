name: NPM Publish

on:
  push:
    branches:
      - trunk

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin trunk

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build package
        run: bun run build

      # - name: Run tests
      #   continue-on-error: true # ⚠️ ВРЕМЕННО: продолжить, даже если тесты падают
      #   run: bun test

      - name: Lint
        run: bun run lint

      - name: Automated Version Bump
        id: version-bump
        uses: phips28/gh-action-bump-version@master
        with:
          skip-tag: "true"
          minor-wording: "feat,feature"
          major-wording: "MAJOR,BREAKING CHANGE"
          patch-wording: "fix,refactor"
          rc-wording: "RELEASE,alpha"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Extract new version
        id: extract-version
        run: |
          # read version and store in GITHUB_ENV for later steps
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update microboard-ui-temp references
        run: |
          # find and replace any microboard-ui-temp@ → current version
          grep -RIlE 'microboard-ui-temp@[0-9]+\.[0-9]+\.[0-9]+' . \
            | xargs sed -i -E "s|(microboard-ui-temp@)[0-9]+\.[0-9]+\.[0-9]+|\1${VERSION}|g"

      - name: Commit updated references
        run: |
          git add .
          git commit -m "chore: sync microboard-ui-temp URLs to v${VERSION} [skip ci]" || echo "✔️ No changes to commit"
          git push origin trunk

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
