name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - staging
      - serverless
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to deploy
        required: true
        default: staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run scripts/buildProd.ts
        env:
          API_URL: ${{ secrets.API_URL }}

      - name: Deploy to Cloudflare Pages
        run: |
          if [ "${TARGET_BRANCH}" = "serverless" ]; then
            PROJECT="microboard-front-dev"
          else
            PROJECT="microboard-front-staging"
          fi
          bunx wrangler pages deploy dist --project-name=$PROJECT 2>&1 | tee deploy.log; exit ${PIPESTATUS[0]}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy.log
